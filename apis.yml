aid: yalo
name: Yalo
description: 'Yalo is an intelligent sales platform that uses AI agents to help consumer
  brands sell through conversational channels like WhatsApp, mobile apps, and phone
  calls, managing complete customer journeys across more than 40 countries. Its Oris
  AI sales agent, conversational commerce platform, and cross-platform Chat SDK (Flutter,
  Android, iOS, and web, with a published gRPC/protobuf message contract) serve CPG,
  financial services, telco, and eCommerce customers including Nestle, Coca-Cola FEMSA,
  Mondelez, PepsiCo, and Unilever.'
